<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi Math</title>
<meta name="description" content="مهامك ودروسك وتسليم وظائفك">
<meta name="theme-color" content="#1A7FB8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://n-script.googleusercontent.com">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/student-32.png">
<link rel="apple-touch-icon" href="../icons/student-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pi Math">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #EAF5FC; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; height: 100dvh; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #EAF5FC; color: #1f3a52; transition: opacity .3s; z-index: 2; text-align: center; padding: 24px; }
  .splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(20,40,60,.2); }
  .splash b { font-size: 20px; }
  .splash small { color: #5a6b78; font-size: 14px; }
  .splash.gone { opacity: 0; pointer-events: none; }
  .bar { width: 120px; height: 4px; border-radius: 2px; background: #d6e4ee; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #1A7FB8; border-radius: 2px; animation: go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(160%); } to { transform: translateX(-260%); } }
  .help { display: none; max-width: 340px; line-height: 1.7; }
  .help a, .help button { display: inline-block; margin-top: 10px; background: #1A7FB8; color: #fff; border: 0; border-radius: 12px; padding: 10px 18px; font: inherit; font-weight: 700; text-decoration: none; }
  .splash.slow .help { display: block; }
  /* زر/بطاقة التثبيت */
  .inst { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; background: #fff; color: #1f3a52; border-radius: 18px; box-shadow: 0 10px 40px rgba(10,30,50,.35); padding: 14px 16px; display: none; gap: 12px; align-items: center; font-size: 15px; line-height: 1.6; max-width: 520px; margin: 0 auto; animation: up .35s ease-out; }
  .inst.on { display: flex; }
  .inst img { width: 52px; height: 52px; border-radius: 13px; flex: none; }
  .inst .t { flex: 1; min-width: 0; }
  .inst b { display: block; font-size: 16px; }
  .inst .go { background: #1A7FB8; color: #fff; border: 0; border-radius: 12px; padding: 10px 16px; font: inherit; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .inst .x { position: absolute; top: 6px; left: 8px; border: 0; background: none; font-size: 22px; color: #8a99a6; cursor: pointer; padding: 4px 8px; }
  .inst .sh { display: inline-flex; vertical-align: -5px; width: 22px; height: 22px; color: #1677d2; }
  .inst .arrow { position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%); font-size: 28px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5); animation: bob 1s ease-in-out infinite; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bob { 50% { transform: translate(-50%, 6px); } }
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="../icons/student-512.png" alt="">
  <b>Pi Math</b>
  <div class="bar" aria-hidden="true"><i></i></div>
  <small id="msg">لحظة…</small>
  <div class="help" id="help">
    <small>التحميل يأخذ وقتًا أطول من المعتاد. تأكّد من الاتصال بالإنترنت.</small><br>
    <button type="button" id="retry">حاول مرة أخرى</button>
    <a id="open" target="_blank" rel="noopener">افتح في المتصفح</a>
  </div>
</div>
<div class="inst" id="inst" role="dialog" aria-label="تثبيت التطبيق">
  <button type="button" class="x" id="instX" aria-label="ليس الآن">×</button>
  <img src="../icons/student-192.png" alt="">
  <div class="t" id="instT"></div>
  <button type="button" class="go" id="instGo" hidden>📲 ثبّت</button>
  <span class="arrow" id="instArrow" hidden>⬇</span>
</div>
<script src="../config.js"></script>
<script>

/* ذاكرة التطبيق الدائمة: تحفظ بيانات الدخول للمنصّة (التي تعمل داخل إطار قد تُمسح ذاكرته)، وتعيدها عند كل فتح */
(function () {
  var KEY = 'pm_student';
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/i.test(e.origin)) return;
    var m = e.data; if (!m || !m.pm || m.kind !== 'student') return;
    var cur = {}; try { cur = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (x) {}
    var CK = 'pm_cache_' + KEY;
    if (m.pm === 'get') { var cache = null; try { cache = JSON.parse(localStorage.getItem(CK) || 'null'); } catch (x) {} try { e.source.postMessage({ pm: 'data', data: cur, cache: cache }, e.origin); } catch (x) {} }
    else if (m.pm === 'save' && m.cache !== undefined) {
      try { if (m.cache === null) localStorage.removeItem(CK); else if (typeof m.cache === 'object') { var sz = JSON.stringify(m.cache); if (sz.length < 2500000) localStorage.setItem(CK, sz); } } catch (x) {}
      if (m.data && typeof m.data === 'object') { Object.keys(m.data).forEach(function (k) { if (/^mt_[a-z]+$/.test(k)) cur[k] = String(m.data[k] == null ? '' : m.data[k]).slice(0, 500); }); try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (x) {} }
    }
    else if (m.pm === 'save' && m.data && typeof m.data === 'object') {
      Object.keys(m.data).forEach(function (k) { if (/^mt_[a-z]+$/.test(k)) cur[k] = String(m.data[k] == null ? '' : m.data[k]).slice(0, 500); });
      try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (x) {}
    }
  });
})();
(function () {
  var splash = document.getElementById('splash'), msg = document.getElementById('msg');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
  var ready = /^https:\/\/script\.google\.com\//.test(APP_URL);
  if (!ready) {
    msg.textContent = 'لم يُضَف رابط الموقع بعد. افتح الملف config.js وضع فيه رابط /exec.';
    document.querySelector('.bar').remove();
    return;
  }
  var url = APP_URL.replace(/\?.*$/, '') + '';
  document.getElementById('open').href = url;
  var f = null, tries = 0, readyGot = false, fb = null;
  var slow = setTimeout(function () { splash.classList.add('slow'); }, 15000);
  var hide = function () { clearTimeout(slow); splash.classList.add('gone'); };
  // نُنشئ الإطار فورًا؛ وإن لم تصل إشارة «جاهز» خلال 8 ثوانٍ نعيد تحميله مرة واحدة تلقائيًا (التعليق العابر غالبًا ينجح في المحاولة الثانية)
  var load = function () {
    if (f) f.remove();
    f = document.createElement('iframe');
    f.title = document.title;
    f.allow = 'clipboard-write; fullscreen; camera';
    f.src = url;
    f.onload = function () { msg.textContent = 'تقريبًا جاهز…'; clearTimeout(fb); fb = setTimeout(hide, 9000); };
    document.body.appendChild(f);
    tries++;
    if (tries === 1) setTimeout(function () { if (!readyGot) { msg.textContent = 'إعادة المحاولة…'; load(); } }, 8000);
  };
  window.addEventListener('message', function (e) {
    if (/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/i.test(e.origin) && e.data && e.data.pm === 'ready') { readyGot = true; clearTimeout(fb); hide(); }
  });
  load();
  document.getElementById('retry').onclick = function () { location.reload(); };
})();

/* ---------- التثبيت بأسهل طريقة ---------- */
(function () {
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) return;
  var later = 0; try { later = +localStorage.getItem('pm_inst_later') || 0; } catch (e) {}
  if (Date.now() - later < 3 * 24 * 3600 * 1000) return;
  var box = document.getElementById('inst'), t = document.getElementById('instT'), go = document.getElementById('instGo');
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var deferred = null;
  document.getElementById('instX').onclick = function () { box.classList.remove('on'); try { localStorage.setItem('pm_inst_later', Date.now()); } catch (e) {} };
  // Android / Chrome: زر تثبيت مباشر
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    t.innerHTML = '<b>ثبّت Pi Math على هاتفك</b>ضغطة واحدة، ويظهر بأيقونته على الشاشة';
    go.hidden = false; box.classList.add('on');
  });
  go.onclick = function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function (r) { if (r.outcome === 'accepted') box.classList.remove('on'); deferred = null; });
  };
  window.addEventListener('appinstalled', function () { box.classList.remove('on'); });
  // iPhone / iPad: لا يوجد زر تثبيت، فنشرح الخطوتين
  if (ios) {
    var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
    var share = '<svg class="sh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"/></svg>';
    t.innerHTML = '<b>ثبّت Pi Math على هاتفك</b>'
      + (safari ? 'اضغط ' + share + ' في أسفل الشاشة، ثم <b style="display:inline">«إضافة إلى الشاشة الرئيسية»</b>'
                : 'اضغط ' + share + ' (مشاركة)، ثم <b style="display:inline">«إضافة إلى الشاشة الرئيسية»</b>');
    if (safari && !/iPad/.test(ua)) document.getElementById('instArrow').hidden = false;
    setTimeout(function () { box.classList.add('on'); }, 2500);
  }
})();
</script>
</body>
</html>
