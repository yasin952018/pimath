<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi Math معلم</title>
<meta name="description" content="إدارة الصفوف والمواد والتسليمات">
<meta name="theme-color" content="#14283A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/teacher-32.png">
<link rel="apple-touch-icon" href="../icons/teacher-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pi Math معلم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #EEF2F5; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; height: 100dvh; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #EEF2F5; color: #1f3a52; transition: opacity .3s; z-index: 2; text-align: center; padding: 24px; }
  .splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(20,40,60,.2); }
  .splash b { font-size: 20px; }
  .splash small { color: #5a6b78; font-size: 14px; }
  .splash.gone { opacity: 0; pointer-events: none; }
  .bar { width: 120px; height: 4px; border-radius: 2px; background: #d6e4ee; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #14283A; border-radius: 2px; animation: go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(160%); } to { transform: translateX(-260%); } }
  .help { display: none; max-width: 340px; line-height: 1.7; }
  .help a, .help button { display: inline-block; margin-top: 10px; background: #14283A; color: #fff; border: 0; border-radius: 12px; padding: 10px 18px; font: inherit; font-weight: 700; text-decoration: none; }
  .splash.slow .help { display: block; }
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="../icons/teacher-512.png" alt="">
  <b>Pi Math معلم</b>
  <div class="bar" aria-hidden="true"><i></i></div>
  <small id="msg">لحظة…</small>
  <div class="help" id="help">
    <small>التحميل يأخذ وقتًا أطول من المعتاد. تأكّد من الاتصال بالإنترنت.</small><br>
    <button type="button" id="retry">حاول مرة أخرى</button>
    <a id="open" target="_blank" rel="noopener">افتح في المتصفح</a>
  </div>
</div>
<script src="../config.js"></script>
<script>
(function () {
  var splash = document.getElementById('splash'), msg = document.getElementById('msg');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
  var ready = /^https:\/\/script\.google\.com\//.test(APP_URL);
  if (!ready) {
    msg.textContent = 'لم يُضَف رابط الموقع بعد. افتح الملف config.js وضع فيه رابط /exec.';
    document.querySelector('.bar').remove();
    return;
  }
  var url = APP_URL.replace(/\?.*$/, '') + '?page=teacher';
  document.getElementById('open').href = url;
  var f = document.createElement('iframe');
  f.title = 'Pi Math معلم';
  f.allow = 'clipboard-write; fullscreen; camera';
  f.src = url;
  var slow = setTimeout(function () { splash.classList.add('slow'); }, 15000);
  f.onload = function () { clearTimeout(slow); splash.classList.add('gone'); };
  document.body.appendChild(f);
  document.getElementById('retry').onclick = function () { location.reload(); };
})();
</script>
</body>
</html>
